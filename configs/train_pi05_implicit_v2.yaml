dataset:
  repo_id: lehome_competition
  root: Datasets/example/four_types_merged_reject
  video_backend: pyav

policy:
  type: pi05_implicit
  implicit_conditioning:
    enabled: true
    variant: v2
    latent_dim: 8
    source_image_key: observation.images.top_rgb
    target_state_key: observation.state
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [20]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/pi05_implicit_v2
batch_size: 16
steps: 75000
save_freq: 5000
log_freq: 200
num_workers: 8
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 5e-5
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 2000
  num_decay_steps: 112500
  peak_lr: 5e-5
  decay_lr: 5e-6

wandb:
  enable: true
  project: lehome-challenge
