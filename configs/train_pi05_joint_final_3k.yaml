# ============================================================================
# Joint Action Training Config for Pi0.5 — final_3k (2×8 H20 140G)
# ============================================================================
# Dataset: final_3k (3,017 episodes, 906,582 frames)
# Compute: 2 nodes × 8 H20 = 16 GPUs, effective batch = 384
# 106,000 steps @ eff_bs=384 ≈ 44.9 passes over data
#
# Optimizations vs baseline:
#   - bs=24 per GPU (H20 140G headroom)
#   - compile_model=true with reduce-overhead (PyTorch 2.7 safe)
#   - weight_decay=0.05 (stronger regularization for fine-tuning)
#   - persistent_workers=true (via train script patch)
#   - float32_matmul_precision=high (via train script patch)
#
# Training command (single-node 8 GPU):
#   accelerate launch --mixed_precision=bf16 --num_processes=8 \
#     scripts/train_pi05_joint_optimized.py \
#     --config_path=configs/train_pi05_joint_final_3k.yaml \
#     2>&1 | tee logs/train_pi05_joint_final_3k_$(date +%Y%m%d_%H%M%S).log
#
# Multi-node (2×8 GPU):
#   pixi run torchrun --nnodes=2 --nproc-per-node=8 \
#     --master-addr=$MASTER_ADDR --master-port=$MASTER_PORT \
#     scripts/train_pi05_joint_optimized.py \
#     --config_path=configs/train_pi05_joint_final_3k.yaml
# ============================================================================

dataset:
  repo_id: lehome_competition
  root: /home/jovyan/code/vla/temp_datas_v1/pi05_mz/datas/LeHome/final_3k
  video_backend: pyav

  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.85, 1.15]      # wider range for synthetic lighting robustness
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.85, 1.15]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.6, 1.4]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base

  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16

  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1

  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10

  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true

  # torch.compile disabled: hangs on Pi0.5 Gemma 2.3B with PyTorch 2.7
  # Revisit after baseline verified or PyTorch upgraded
  compile_model: false
  compile_mode: "reduce-overhead"

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: /home/jovyan/code/vla/temp_datas_v1/pi05_mz/checkpoints/LeHome/pi05_joint_final_3k
batch_size: 24                         # Per-GPU, effective = 16 × 24 = 384
steps: 106000                           # 44.9 passes over data
save_freq: 5000                         # Every ~2.1 data passes
log_freq: 200
num_workers: 4                          # Reduced: 16×4=64 workers, avoid shared mem pressure

use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 5e-5                             # sqrt scaling: 3e-5 × √(384/128)
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.05                    # Stronger regularization for fine-tuning
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 2000               # ~2% warmup
  num_decay_steps: 127000               # 1.2x total — avoids premature decay
  peak_lr: 5e-5
  decay_lr: 5e-6                        # 1/10 of peak

wandb:
  enable: true
  project: lehome-challenge
