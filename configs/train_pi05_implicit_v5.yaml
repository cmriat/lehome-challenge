dataset:
  repo_id: lehome_competition
  root: /home/jovyan/code/vla/temp_datas_v1/pi05_mz/datas/LeHome/final_3k_type_prob
  video_backend: pyav

  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.85, 1.15]      # final_3k style
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.85, 1.15]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.6, 1.4]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]

policy:
  type: pi05_implicit
  implicit_conditioning:
    enabled: true
    variant: v5
    latent_dim: 12
    source_image_key: observation.images.top_rgb
    target_state_key: observation.state
    anchor_encoder_name_or_path: vit_base_patch14_dinov2.lvd142m
    anchor_pooling: attn
    anchor_attn_num_queries: 4
    anchor_attn_num_heads: 8
    anchor_feat_dim: 768
    anchor_proj_dim: 12
    anchor_proj_hidden_dims: [256, 64]
    freeze_anchor_encoder: true
    lora_enabled: false
    lora_rank: 8
    lora_alpha: 16.0
    lora_target_blocks: 4
    type_as_instruction: true
    state_concat_enabled: false
  aux_type_loss_weight: 0.2
  aux_type_warmup_start_ratio: 0.1
  aux_type_warmup_end_ratio: 0.3
  total_training_steps: 50000
  type_target_key: observation.garment_type_prob
  type_num_classes: 4
  split_latent: true
  z_task_dim: 8
  z_type_dim: 4
  weak_coupling: true
  weak_coupling_apply_at_inference: true
  weak_coupling_gate_bias_init: 2.0      # v5: sigmoid(2)≈0.88 → near-open init
  weak_coupling_residual: true
  action_mod_target: __disabled_train_action_mod__
  action_mod_mode: gate_bias
  action_mod_use_z_type: true
  action_mod_use_z_task: true
  action_mod_residual: true
  state_concat_enabled: false
  type_as_instruction: true
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [20]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/pi05_implicit_v5_final_3k
batch_size: 24                         # eff_bs=24×16=384, ~2,361 steps/epoch
steps: 50000                            # 21.2 epochs
save_freq: 2500                         # ~1 epoch/checkpoint
log_freq: 50
num_workers: 4
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 5e-5                             # match v4_final_3k
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.05                    # match v4_final_3k
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000               # ~2% warmup
  num_decay_steps: 50000
  peak_lr: 5e-5
  decay_lr: 5e-6                        # 1/10 of peak

wandb:
  enable: true
  project: lehome-challenge
