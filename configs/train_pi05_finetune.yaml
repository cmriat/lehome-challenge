# ============================================================================
# Fine-tuning from existing checkpoint with augmented dataset
# ============================================================================
# 从 lehome_pi05_step62k_reject checkpoint 继续训练，使用增强数据集
# 增强数据包含: 原始数据 + Reject Sampling v1/v2 + Cross-Garment Replay
#
# Single node, 8 GPUs:
#   accelerate launch --mixed_precision=bf16 --num_processes=8 $(which lerobot-train) \
#     --config_path=configs/train_pi05_finetune.yaml 2>&1 | tee logs/finetune_$(date +%Y%m%d_%H%M%S).log
#
# Single GPU:
#   lerobot-train --config_path=configs/train_pi05_finetune.yaml
# ============================================================================

dataset:
  repo_id: augmented_training_v2
  root: Datasets/augmented_training_v2

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: /home/nvidia/maoz/ckpts/lehome_pi05_step62k_reject

  # Model configuration (same as original)
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16

  # Action prediction settings (same as original)
  chunk_size: 30
  n_action_steps: 30
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10

  # Full fine-tuning
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: false
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/pi05_finetune_augmented
batch_size: 8
# ~1700 episodes, ~470K frames -> ~58K steps/epoch
# Fine-tune ~3-5 epochs
steps: 200000
save_freq: 10000
log_freq: 200

use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 2.5e-5                             # Lower LR for fine-tuning (half of original)
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 2000                 # Shorter warmup for fine-tuning
  num_decay_steps: 200000
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

wandb:
  enable: true
  project: lehome-challenge
