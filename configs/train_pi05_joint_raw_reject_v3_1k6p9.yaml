# ============================================================================
# Joint Action Training Config for Pi0.5 (2 nodes)
# ============================================================================

dataset:
  repo_id: lehome_competition
  root: Datasets/example/raw_reject_v3_1k6p9
  video_backend: pyav

  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.9, 1.1]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.9, 1.1]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.7, 1.3]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.03, 0.03]

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: /home/jovyan/code/vla/temp_datas_v1/pi05_mz/checkpoints/LeHome/pi05_joint_raw_reject_v3_1k6p9
batch_size: 16
steps: 60000
save_freq: 5000
log_freq: 200
num_workers: 2
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 5e-5
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1200
  num_decay_steps: 72000
  peak_lr: 5e-5
  decay_lr: 5e-6

wandb:
  enable: true
  project: lehome-challenge
