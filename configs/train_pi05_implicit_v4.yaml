dataset:
  repo_id: lehome_competition
  root: Datasets/example/train_ds_v3_with_typeprob
  video_backend: pyav

  # Light color augmentation only — no spatial transforms (harmful for manipulation tasks)
  # SigLIP pretrained encoder already has strong visual robustness
  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.9, 1.1]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.9, 1.1]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.7, 1.3]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.03, 0.03]

policy:
  type: pi05_implicit
  implicit_conditioning:
    enabled: true
    variant: v4
    latent_dim: 12
    source_image_key: observation.images.top_rgb
    target_state_key: observation.state
  aux_type_loss_weight: 0.2
  aux_type_warmup_start_ratio: 0.1
  aux_type_warmup_end_ratio: 0.3
  total_training_steps: 60000
  type_target_key: observation.garment_type_prob
  type_num_classes: 4
  split_latent: true
  z_task_dim: 8
  z_type_dim: 4
  weak_coupling: true
  weak_coupling_apply_at_inference: true
  weak_coupling_gate_bias_init: 2.0
  weak_coupling_residual: true
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [20]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/pi05_implicit_v4
batch_size: 16                         # Per-GPU, effective batch = 16 × 16 = 256 on 2 nodes
steps: 60000                           # Align with policy.total_training_steps
save_freq: 5000
log_freq: 200
num_workers: 8

# Use custom optimizer settings (override policy preset)
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 3e-5                             # Keep LR fixed first when scaling to 16 GPUs
  betas: [0.9, 0.95]                   # Pi0.5 defaults
  eps: 1e-8
  weight_decay: 0.01                   # Pi0.5 default
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1200               # ~2% warmup over 60K steps
  num_decay_steps: 72000               # 1.2x of total steps to avoid overly aggressive LR decay
  peak_lr: 3e-5                        # Match optimizer lr
  decay_lr: 3e-6                       # 1/10 of peak

wandb:
  enable: true
  project: lehome-challenge
