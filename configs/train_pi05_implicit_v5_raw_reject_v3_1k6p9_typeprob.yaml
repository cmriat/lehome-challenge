dataset:
  repo_id: lehome_competition
  root: Datasets/example/raw_reject_v3_1k6p9_typeprob
  video_backend: pyav

  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.9, 1.1]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.9, 1.1]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.7, 1.3]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.03, 0.03]

policy:
  type: pi05_implicit
  implicit_conditioning:
    enabled: true
    variant: v5
    latent_dim: 12
    source_image_key: observation.images.top_rgb
    target_state_key: observation.state
    anchor_encoder_name_or_path: vit_base_patch14_dinov2.lvd142m
    anchor_pooling: mean
    anchor_feat_dim: 768
    anchor_proj_dim: 12
    freeze_anchor_encoder: true
    type_as_instruction: true
    state_concat_enabled: false
  aux_type_loss_weight: 0.1
  aux_type_warmup_start_ratio: 0.1
  aux_type_warmup_end_ratio: 0.3
  total_training_steps: 60000
  type_target_key: observation.garment_type_prob
  type_num_classes: 4
  split_latent: true
  z_task_dim: 8
  z_type_dim: 4
  weak_coupling: true
  weak_coupling_apply_at_inference: true
  weak_coupling_gate_bias_init: 2.0
  weak_coupling_residual: true
  action_mod_target: __disabled_train_action_mod__
  action_mod_mode: gate_bias
  action_mod_use_z_type: true
  action_mod_use_z_task: true
  action_mod_residual: true
  state_concat_enabled: false
  type_as_instruction: true
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  chunk_size: 30
  n_action_steps: 10
  n_obs_steps: 1
  max_state_dim: 32
  max_action_dim: 32
  image_resolution: [224, 224]
  num_inference_steps: 10
  freeze_vision_encoder: false
  train_expert_only: false
  gradient_checkpointing: true
  compile_model: false

  input_features:
    observation.state:
      type: STATE
      shape: [20]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: /home/jovyan/code/vla/temp_datas_v1/pi05_mz/checkpoints/LeHome/pi05_joint_raw_reject_v3_1k6p9_type_prob
batch_size: 16
steps: 60000
save_freq: 5000
log_freq: 200
num_workers: 8
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 5e-5
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1200
  num_decay_steps: 72000
  peak_lr: 5e-5
  decay_lr: 5e-6

wandb:
  enable: true
  project: lehome-challenge
