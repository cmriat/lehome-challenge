# ============================================================================
# Training Command (8x A800 80G)
# ============================================================================
# Single node, 8 GPUs distributed training:
#   accelerate launch --num_processes=8 $(which lerobot-train) --config_path=configs/train_smolvla_full_para.yaml
#   accelerate launch --mixed_precision=bf16 --num_processes=8 $(which lerobot-train) --config_path=configs/train_smolvla_full_para.yaml 2>&1 | tee logs/train_$(date +%Y%m%d_%H%M%S).log
#
# With learning rate scaling (optional, linear scaling rule):
#   accelerate launch --num_processes=8 $(which lerobot-train) \
#     --config_path=configs/train_smolvla_full_para.yaml \
#     --optimizer.lr=4e-4
#
# Note: For mixed precision (bfloat16), use accelerate config or CLI:
#   accelerate launch --mixed_precision=bf16 --num_processes=8 ...
# ============================================================================

dataset:
  repo_id: lehome_competition
  root: Datasets/example/four_types_merged

  # Enhanced image augmentation for better generalization
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: true          # Random order increases diversity
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.7, 1.3]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.7, 1.3]
      saturation:
        weight: 0.8
        type: ColorJitter
        kwargs:
          saturation: [0.7, 1.3]
      hue:
        weight: 0.3
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]
      sharpness:
        weight: 0.5
        type: SharpnessJitter
        kwargs:
          sharpness: [0.5, 1.5]

policy:
  type: smolvla
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/smolvla_base

  # Full fine-tuning for 8x A800 80G
  freeze_vision_encoder: false
  train_expert_only: false
  train_state_proj: true

  input_features:
    observation.state:
      type: STATE
      shape: [12]
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 480, 640]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 480, 640]

  output_features:
    action:
      type: ACTION
      shape: [12]

output_dir: outputs/train/smolvla_full_para
batch_size: 32
steps: 31140                    # 30 epochs (1,038 steps/epoch)
save_freq: 3114                 # Every 3 epochs
log_freq: 200

# Use custom optimizer settings (override policy preset)
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 2e-4                      # Conservative LR for full fine-tuning
  weight_decay: 1e-4
  grad_clip_norm: 1.0           # Clip gradients for stability

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000        # ~1 epoch warmup
  num_decay_steps: 31140        # Match total steps
  peak_lr: 2e-4
  decay_lr: 2.5e-6

wandb:
  enable: true
  project: lehome-challenge
