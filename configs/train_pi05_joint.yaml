# ============================================================================
# Joint Action Training Config for Pi0.5 (8x A800 80G)
# ============================================================================
# Standard joint-space action training (absolute joint positions).
#
# Training command:
#   accelerate launch --mixed_precision=bf16 --num_processes=8 \
#     $(which lerobot-train) \
#     --config_path=configs/train_pi05_joint.yaml \
#     2>&1 | tee logs/train_pi05_joint_$(date +%Y%m%d_%H%M%S).log
# ============================================================================

dataset:
  repo_id: lehome_competition
  root: Datasets/example/train_ds_v3
  video_backend: pyav

  # Light color augmentation only — no spatial transforms (harmful for manipulation tasks)
  # SigLIP pretrained encoder already has strong visual robustness
  image_transforms:
    enable: true
    max_num_transforms: 2
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.9, 1.1]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.9, 1.1]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.7, 1.3]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.03, 0.03]

policy:
  type: pi05
  device: cuda
  push_to_hub: false
  pretrained_path: lerobot/pi05_base

  # Pi0.5 model configuration
  paligemma_variant: gemma_2b          # Vision-language backbone
  action_expert_variant: gemma_300m    # Action prediction expert
  dtype: bfloat16                      # Use bf16 for training

  # Action prediction settings
  chunk_size: 30                       # Default 50, better long-range planning for folding tasks
  n_action_steps: 10                   # Execute 10 steps then re-predict for higher reactivity
  n_obs_steps: 1                       # Single observation

  # Dimension settings (will be padded internally)
  max_state_dim: 32                    # Pi0.5 pads to 32
  max_action_dim: 32                   # Pi0.5 pads to 32

  # Image resolution (Pi0.5 uses 224x224)
  image_resolution: [224, 224]

  # Flow matching inference
  num_inference_steps: 10              # Balance between quality and speed (default: 10)

  # Full fine-tuning for 8x A800 80G
  freeze_vision_encoder: false
  train_expert_only: false

  # Memory optimization
  gradient_checkpointing: true
  compile_model: false                 # Disabled: 4B model compile hangs with max-autotune on 8xGPU

  input_features:
    observation.state:
      type: STATE
      shape: [12]                      # Will be padded to 32
    observation.images.top_rgb:
      type: VISUAL
      shape: [3, 224, 224]             # Pi0.5 resolution
    observation.images.left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_rgb:
      type: VISUAL
      shape: [3, 224, 224]

  output_features:
    action:
      type: ACTION
      shape: [12]                      # Will be padded to 32

output_dir: outputs/train/pi05_joint
batch_size: 16                         # Per-GPU, effective batch = 16 × 16 = 256 on 2 nodes
steps: 60000                           # Keep total training samples comparable to 8-GPU bs16 runs
save_freq: 5000
log_freq: 200
num_workers: 8

# Use custom optimizer settings (override policy preset)
use_policy_training_preset: false

optimizer:
  type: adamw
  lr: 3e-5                             # Keep LR fixed first when scaling to 16 GPUs
  betas: [0.9, 0.95]                   # Pi0.5 defaults
  eps: 1e-8
  weight_decay: 0.01                   # Pi0.5 default
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1200               # ~2% warmup over 60K steps
  num_decay_steps: 72000               # 1.2x of total steps to avoid overly aggressive LR decay
  peak_lr: 3e-5                        # Match optimizer lr
  decay_lr: 3e-6                       # 1/10 of peak

wandb:
  enable: true
  project: lehome-challenge
